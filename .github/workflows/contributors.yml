name: Contribuidores

# Atualiza docs/assets/contributors.svg (imagem de contribuidores do README) a cada
# commit no main, uma vez por semana e sob demanda.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar a imagem de contribuidores
        run: python scripts/contributors.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/contributors.svg
          if git diff --cached --quiet; then
            echo "Imagem sem mudança."
          else
            git commit -m "Atualiza a imagem de contribuidores"
            git pull --rebase origin main
            git push
          fi
